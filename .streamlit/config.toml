# 토스증권 웹풍 다크 테마
[theme]
base = "dark"
primaryColor = "#3182F6"             # 액센트(버튼/위젯) 토스 블루
backgroundColor = "#17171C"          # 토스 웹 다크 배경
secondaryBackgroundColor = "#1E1F25" # 카드/사이드바
textColor = "#E5E8EB"                # 오프화이트 텍스트
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false   # 첫 실행 이메일 입력 프롬프트 방지(터미널 멈춤 방지)

[server]
headless = true            # 이메일 프롬프트 없이 바로 서버 기동
